# Canonical host is devliora.com (no www). Everything else 301s to it.

# --- www -> non-www (HTTPS) -------------------------------------------------
# Previously www.devliora.com and devliora.com were both served from the
# single server block below, so both answered 200 and search engines could
# index the site under two hostnames. This block collapses www onto the
# canonical host with a permanent redirect, preserving path and query.
server {
    listen 443 ssl;
    server_name www.devliora.com;

    ssl_certificate /etc/letsencrypt/live/devliora.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/devliora.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://devliora.com$request_uri;
}

# --- canonical host ------------------------------------------------------------
server {
    server_name devliora.com;

    location /api/ {
        client_max_body_size 10M;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /scalar {
        proxy_pass http://127.0.0.1:8080/scalar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/devliora.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/devliora.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# --- HTTP -> HTTPS -----------------------------------------------------------
server {
    if ($host = www.devliora.com) {
        return 301 https://devliora.com$request_uri;
    }

    if ($host = devliora.com) {
        return 301 https://devliora.com$request_uri;
    }

    listen 80;
    server_name devliora.com www.devliora.com;
    return 404; # managed by Certbot
}
