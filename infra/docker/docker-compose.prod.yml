services:
  postgres:
    image: postgres:16-alpine
    container_name: devliora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devliora-net
  redis:
    image: redis:7-alpine
    container_name: devliora-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devliora-net
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: devliora-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      Cors__AllowedOrigins__1: https://www.devliora.com
      Assistant__GeminiApiKey: ${GEMINI_API_KEY}
      Assistant__GeminiModel: "gemini-2.0-flash"
      Assistant__GeminiDailyQuota: ${GEMINI_DAILY_QUOTA:-8}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__WebhookSecretToken: ${TELEGRAM_WEBHOOK_SECRET}
      Telegram__GeminiApiKey: ${TELEGRAM_GEMINI_API_KEY}
      Telegram__GeminiModel: "gemini-2.0-flash"
      Telegram__GeminiDailyQuota: ${TELEGRAM_GEMINI_DAILY_QUOTA:-8}
      Telegram__AdminChatId: ${TELEGRAM_ADMIN_CHAT_ID}
    ports:
      - "8080:8080"
    networks:
      - devliora-net
    volumes:
      - ../../backend/src/Devliora.WebApi/wwwroot/uploads:/app/wwwroot/uploads
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        NEXT_PUBLIC_CLARITY_PROJECT_ID: ${NEXT_PUBLIC_CLARITY_PROJECT_ID}
    container_name: devliora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - devliora-net
networks:
  devliora-net:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
